name: Build and Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Work out next version
        id: version
        run: |
          latest=$(git tag -l 'v*.*.*' --sort=-v:refname | head -n 1)
          if [ -z "$latest" ]; then
            next="1.0.0"
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            next="$major.$minor.$((patch + 1))"
          fi
          echo "Next version: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Publish win-x86 single-file exe
        run: dotnet publish MapTest/MapTest.csproj -p:PublishProfile=FolderProfile -p:Version=${{ steps.version.outputs.version }} -o out

      - uses: actions/upload-artifact@v4
        with:
          name: MapTest
          path: out/MapTest.exe

      - name: Create GitHub release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" out/MapTest.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes
